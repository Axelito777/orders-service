# Perfil de test: sin broker de Kafka real
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:1
kafka.producer.max-block-ms=500
logging.level.org.apache.kafka=ERROR
# ms-pago inexistente: si algún test lo llama, falla rápido y se aplica fail-open
ms-pago.url=http://localhost:1
ms-pago.timeout-ms=300
