server.port=8083
spring.application.name=orders-service

spring.datasource.url=jdbc:h2:mem:ordersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Azure Entra ID: cada servicio valida el JWT (no son secretos, son identificadores públicos)
# Con estos dos valores SecurityConfig arma el emisor, la URL de llaves (JWKS) y las audiencias
azure.tenant-id=${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
azure.client-id=${AZURE_CLIENT_ID:42b7d432-638e-4b04-9368-9616b322e672}

# Kafka (solo productor): cada pedido se publica en order-events para reportes-service
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Máximo (ms) que se espera a Kafka al publicar; si se supera, la compra sale igual
kafka.producer.max-block-ms=${KAFKA_MAX_BLOCK_MS:1500}

# ms-pago: consulta si el usuario está bloqueado por el antifraude (423). Fail-open si no responde.
# En la EC2 (mismo docker-compose): MS_PAGO_URL=http://ms-pago:8087
ms-pago.url=${MS_PAGO_URL:http://localhost:8087}
ms-pago.timeout-ms=${MS_PAGO_TIMEOUT_MS:1500}
